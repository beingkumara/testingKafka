<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <!-- Font preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Titillium Web (body/UI) + Orbitron (telemetry numbers) + Roboto Mono (data) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600;1,700&family=Orbitron:wght@400;700;900&family=Roboto+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FanF1x — The apex of Formula 1 analytics. Real-time standings, race results, driver profiles, and telemetry data for the current F1 season." />
  <meta name="theme-color" content="#E10600" />
  <title>FanF1x - Formula 1 Analytics</title>
</head>
<style>
  body {
    background-color: #0A0A0E;
    color: #ffffff;
  }
</style>
<script>
  (function () {
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme === 'dark' || (!savedTheme && prefersDark) || !savedTheme) {
      document.documentElement.classList.add('dark');
      // Fallback default to dark if no preference
      if (!savedTheme) localStorage.setItem('theme', 'dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  })();
</script>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
